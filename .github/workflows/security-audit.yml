# ============================================================
# security-audit.yml — 密钥泄漏审计（gitleaks + 分级处置）
# 仓库：Sth32/skills（模板：新仓库加入审计 = 复制本文件 + 配好 secrets）
# 触发：push / 每周一 03:00 UTC（北京 11:00）/ 手动
# 分级：P0 高危 -> 钉钉告警 + 唤醒 CNB 打工人撤销/移除；P1 疑似 -> 钉钉告警人工确认
# 防循环：打工人修复提交以 [ci-skip-notify] 开头 -> 跳过
# 前置：Actions secrets 需 CNB_TOKEN、DINGTALK_WEBHOOK、DINGTALK_SECRET
#   （CNB_TOKEN 触发打工人；钉钉两个 secret 用于 P0/P1 告警直发）
# ============================================================
name: Security audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC = 北京 11:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # push 时跳过打工人自己的修复提交；schedule/dispatch 总是全量扫
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[ci-skip-notify]') }}
    steps:
      - name: 检出全历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version

      - name: 全历史扫描
        id: scan
        run: |
          set +e
          ./gitleaks detect --source . --report-path gitleaks-report.json \
            --report-format json --no-banner
          rc=$?
          echo "gitleaks exit=$rc (1=发现泄漏，属预期；0=干净)"
          ls -la gitleaks-report.json
          exit 0

      - name: 分级与处置
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python3 scripts/security_audit.py \
            --report gitleaks-report.json \
            --repo "${{ github.repository }}" \
            --commit "${{ github.sha }}"
