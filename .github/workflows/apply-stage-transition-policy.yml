# Also use direct workflow-file changes as an explicit CI closure point after policy migrations.
name: Apply stage transition policy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stage-transition-policy.yml
      - scripts/apply_stage_transition_policy.py
      - skills/**/SKILL.md
      - README.md

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply canonical stage transition policy
        run: python scripts/apply_stage_transition_policy.py
      - name: Validate skills
        run: python scripts/validate_skills.py
      - name: Commit generated updates
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md skills
          git commit -m "Apply stage transition gate to all skills"
          git push
