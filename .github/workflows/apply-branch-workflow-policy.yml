name: Apply branch workflow policy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-branch-workflow-policy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fix one-shot migration helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_branch_workflow_policy.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'BRANCH_EVAL = ROOT / "evals/branch-workflow.md"',
              'BRANCH_EVAL_PATH = ROOT / "evals/branch-workflow.md"',
              1,
          )
          text = text.replace(
              'BRANCH_EVAL = """# 分支工作流行为评估',
              'BRANCH_EVAL_CONTENT = """# 分支工作流行为评估',
              1,
          )
          text = text.replace(
              'write_if_changed(BRANCH_EVAL, BRANCH_EVAL, check=args.check)',
              'write_if_changed(BRANCH_EVAL_PATH, BRANCH_EVAL_CONTENT, check=args.check)',
              1,
          )
          text = text.replace(
              'changed.append(BRANCH_EVAL)',
              'changed.append(BRANCH_EVAL_PATH)',
              1,
          )
          text = text.replace('        "强制汇合",\n', '', 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Apply requirement-first branch workflow
        run: python scripts/apply_branch_workflow_policy.py
      - name: Update validator for independent branch reviews
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/validate_skills.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'SPEC_ROOT_RULE_MARKER = "**根文档硬限制："\nREVIEW_MERGE_RULE_MARKER = "**Review 汇合硬限制："\nBRANCH_INDEX_NAME = "00-工作流索引.md"\nREVIEW_BRANCH_FORBIDDEN_MARKER = "禁止创建 `07-Uxx-*`"',
              'SPEC_BRANCH_RULE_MARKER = "**需求分支硬限制："\nREVIEW_INDEPENDENT_RULE_MARKER = "**独立 Review 硬限制："\nREVIEW_INTEGRATION_RULE_MARKER = "**整体 Review 硬限制："\nBRANCH_INDEX_NAME = "00-工作流索引.md"\nREVIEW_BRANCH_DOC_MARKER = "07-<Uxx>-<主题>-交叉评审.md"',
              1,
          )

          old_spec = '''    if name == "game-spec":\n        if SPEC_ROOT_RULE_MARKER not in text:\n            errors.append("missing original-requirement single-root rule")\n        if "01-Uxx" not in text:\n            errors.append("game-spec must explicitly forbid branched 01 documents")\n'''
          new_spec = '''    if name == "game-spec":\n        if SPEC_BRANCH_RULE_MARKER not in text:\n            errors.append("missing requirement-stage branch rule")\n        if "01-Uxx" not in text or BRANCH_INDEX_NAME not in text:\n            errors.append("game-spec must support requirement-stage work units and workflow index")\n'''
          if old_spec not in text:
              raise SystemExit("validator game-spec anchor not found")
          text = text.replace(old_spec, new_spec, 1)

          old_review = '''    if name == "game-review":\n        if REVIEW_MERGE_RULE_MARKER not in text:\n            errors.append("missing mandatory review convergence rule")\n        if BRANCH_INDEX_NAME not in text:\n            errors.append("game-review must understand branched workflow indexes")\n        if REVIEW_BRANCH_FORBIDDEN_MARKER not in text:\n            errors.append("game-review must explicitly forbid 07-Uxx review documents")\n'''
          new_review = '''    if name == "game-review":\n        if REVIEW_INDEPENDENT_RULE_MARKER not in text:\n            errors.append("missing independent work-unit review rule")\n        if REVIEW_INTEGRATION_RULE_MARKER not in text:\n            errors.append("missing optional integration-review rule")\n        if BRANCH_INDEX_NAME not in text:\n            errors.append("game-review must understand branched workflow indexes")\n        if REVIEW_BRANCH_DOC_MARKER not in text:\n            errors.append("game-review must define per-work-unit 07 review documents")\n'''
          if old_review not in text:
              raise SystemExit("validator game-review anchor not found")
          text = text.replace(old_review, new_review, 1)

          text = text.replace(
              'errors.append("game-docs must locate converged branch inputs through the workflow index")',
              'errors.append("game-docs must locate reviewed branch inputs through the workflow index")',
              1,
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Validate skills
        run: python scripts/validate_skills.py
      - name: Remove one-shot migration helpers
        run: rm -f scripts/apply_branch_workflow_policy.py .github/workflows/apply-branch-workflow-policy.yml
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply requirement-first branch workflow"
          git push
