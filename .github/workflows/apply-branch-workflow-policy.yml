name: Apply branch workflow policy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-branch-workflow-policy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fix one-shot migration helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_branch_workflow_policy.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'BRANCH_EVAL = ROOT / "evals/branch-workflow.md"',
              'BRANCH_EVAL_PATH = ROOT / "evals/branch-workflow.md"',
              1,
          )
          text = text.replace(
              'BRANCH_EVAL = """# 分支工作流行为评估',
              'BRANCH_EVAL_CONTENT = """# 分支工作流行为评估',
              1,
          )
          text = text.replace(
              'write_if_changed(BRANCH_EVAL, BRANCH_EVAL, check=args.check)',
              'write_if_changed(BRANCH_EVAL_PATH, BRANCH_EVAL_CONTENT, check=args.check)',
              1,
          )
          text = text.replace(
              'changed.append(BRANCH_EVAL)',
              'changed.append(BRANCH_EVAL_PATH)',
              1,
          )
          text = text.replace('        "强制汇合",\n', '', 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Apply requirement-first branch workflow
        run: python scripts/apply_branch_workflow_policy.py
      - name: Validate skills
        run: python scripts/validate_skills.py
      - name: Remove one-shot migration helpers
        run: rm -f scripts/apply_branch_workflow_policy.py .github/workflows/apply-branch-workflow-policy.yml
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply requirement-first branch workflow"
          git push
