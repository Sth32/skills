name: Apply document record policy once

on:
  push:
    branches:
      - main
    paths:
      - .github/document-record-policy-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply policy
        run: python scripts/apply_document_record_policy.py
      - name: Validate result
        run: python scripts/validate_skills.py
      - name: Commit generated updates
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/validate_skills.py skills
          git commit -m "Apply document record policy to all skills"
          git push
