name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check canonical policies
        run: python scripts/apply_document_record_policy.py --check
      - name: Validate skills
        run: python scripts/validate_skills.py
      - name: Compile helper scripts
        run: python -m py_compile scripts/*.py
      - name: Test versioned document records
        run: python scripts/test_document_record.py
